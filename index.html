<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathwise</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #f2f4f8; color: #1d2430; }
    header { background: #24324a; color: #fff; padding: 28px 24px; }
    header h1 { margin: 0 0 4px; font-size: 26px; }
    header p { margin: 0; opacity: 0.85; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    main h2.side { margin: 22px 0 10px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: #556; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    .card { background: #fff; border: 1px solid #d6dbe4; border-radius: 10px; padding: 16px 18px; text-decoration: none; color: inherit; }
    a.card:hover { border-color: #6b95e0; box-shadow: 0 2px 10px rgba(47, 111, 214, 0.15); }
    .card h3 { margin: 0 0 6px; font-size: 18px; }
    .card p { margin: 0; color: #556; font-size: 14px; line-height: 1.45; }
    .soon { opacity: 0.6; }
  </style>
</head>
<body>
  <header>
    <h1>Mathwise</h1>
    <p>Math worksheets, quizzes and practice that run in your browser. Your files stay on your computer.</p>
  </header>
  <main>
    <h2 class="side">For teachers</h2>
    <div class="grid">
      <a class="card" href="worksheets/">
        <h3>Worksheets &amp; quizzes</h3>
        <p>Write notes, examples and questions with live math, then print or save as PDF, with an optional answer key.</p>
      </a>
    </div>
    <h2 class="side">For students</h2>
    <div class="grid">
      <div class="card soon">
        <h3>Practice</h3>
        <p>Coming later.</p>
      </div>
    </div>
  </main>
</body>
</html>
